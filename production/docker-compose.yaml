services:
  chatterino:
    image: ghcr.io/zzackllack/chatterino-in-docker:latest
    platform: linux/amd64
    build: .
    ports:
      - "${PORT:-3000}:3000"
      - "${BASEIMAGE_PORT:-3001}:3001"
      - "${KASM_PORT:-6901}:6901"
      # Direct monitoring access bypasses desktop auth; keep it on loopback or a private IP.
      - "${HEALTH_BIND_ADDRESS:-127.0.0.1}:${HEALTH_PORT:-8080}:8080"
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
      - CUSTOM_USER=${CUSTOM_USER:-admin}
      - PASSWORD=${PASSWORD:?Set PASSWORD in .env before starting Chatterino}
      - TITLE=Chatterino
      - HOME=/config
      - XDG_CONFIG_HOME=/config/.config
      - XDG_DATA_HOME=/config/.local/share
      - XDG_CACHE_HOME=/config/.cache
      - CHATTERINO_HEALTH_ACCOUNT=${CHATTERINO_HEALTH_ACCOUNT:-username}
      - CHATTERINO_HEALTH_CACHE_SECONDS=${CHATTERINO_HEALTH_CACHE_SECONDS:-60}
      - CHATTERINO_SETTINGS_PATH=${CHATTERINO_SETTINGS_PATH:-/config/.local/share/chatterino/Settings/settings.json}
    volumes:
      - ./chatterino-data:/config
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "10", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 20s
