services:
  chatterino:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - TZ=Europe/Berlin
      - PUID=1000
      - PGID=1000
      - CUSTOM_USER=${CUSTOM_USER:-admin}
      - PASSWORD=${PASSWORD:-pleaseChange}
      - TITLE=Chatterino
      # Optional: Qt-Debuglogs in stdout (nicht Chatlogs!)
      # - QT_LOGGING_RULES=chatterino.*.debug=true
    volumes:
      - ./chatterino-data:/config # $HOME => /config (enthält Settings & Logs)
    restart: unless-stopped
